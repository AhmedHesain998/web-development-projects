<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback UI</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="container" id="container">
        <h1 class="heading">Feedback UI</h1>
        <div class="ratings-container" id="ratings-container">
            <div class="rating">
                <img src="https://img.icons8.com/emoji/48/worried-face.png" alt="worried-face" />
                <small>Unhappy</small>
            </div>
            <div class="rating">
                <img src="https://img.icons8.com/emoji/48/neutral-face.png" alt="neutral-face" />
                <small>Neutral</small>
            </div>
            <div class="rating">
                <img src="https://img.icons8.com/emoji/48/smiling-face-with-hearts.png"
                    alt="smiling-face-with-hearts" />
                <small>Satisfied</small>
            </div>


        </div>
        <button class="btn" id="btn">Send Review</button>
    </div>

    <script src="./index.js"></script>
</body>

</html>
