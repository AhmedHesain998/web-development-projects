<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="container">
        <h1 class="heading">Temperture Converter</h1>
        <div class="temp-container">
            <label for="celsius">Celsius:</label>
            <input onchange="computeTemp(event)" type="number" name="celsius" id="celsius"
                placeholder="Enter temperature" class="input">
        </div>
        <div class="temp-container">
            <label for="fahernheit">Fahernheit:</label>
            <input onchange="computeTemp(event)" type="number" name="fahrenhit" id="fahrenheit"
                placeholder="Enter temperature" class="input">
        </div>
        <div class="temp-container">
            <label for="celsius">Kelvin:</label>
            <input onchange="computeTemp(event)" type="number" name="kelvin" id="kelvin" placeholder="Enter temperature"
                class="input">
        </div>
    </div>

    <script src="index.js"></script>
</body>

</html>
